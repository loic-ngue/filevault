# Passerelle docker-compose : joue le rôle de l'Ingress Kubernetes (section 9),
# avec le même routage par chemin, pour tout servir depuis une seule origine.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 51m;  # 50 Mo + en-têtes multipart (proxy-body-size sur l'Ingress)

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/upload {
        proxy_pass http://upload-service:3000;
        proxy_request_buffering off;  # le fichier part en flux vers upload-service
    }

    location /api/links {
        proxy_pass http://link-service:3000;
    }

    location /d/ {
        proxy_pass http://download-service:3000;
        proxy_buffering off;  # le fichier déchiffré part en flux vers le navigateur
    }

    location / {
        proxy_pass http://frontend:8080;
    }
}
