name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['k8s/**', 'docs/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cmp services/upload-service/src/crypto.js services/download-service/src/crypto.js

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [link-service, upload-service, download-service, cleanup, frontend]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: [contract, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [link-service, upload-service, download-service, cleanup, frontend]
    env:
      LOCAL_IMAGE: filevault-${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Construction de l'image (étape 4)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Scan de sécurité Trivy (étape 5)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$LOCAL_IMAGE"

      - name: Connexion à GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication sur GHCR (étape 6)
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/filevault-${{ matrix.service }}:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$image"
          docker push "$image"

  manifests:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: manifests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Mise à jour de k8s/kustomization.yaml
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for service in link-service upload-service download-service cleanup frontend; do
            NAME="filevault/$service" NEW_NAME="ghcr.io/$owner/filevault-$service" TAG="$GITHUB_SHA" \
              yq -i '(.images[] | select(.name == strenv(NAME))) |= (.newName = strenv(NEW_NAME) | .newTag = strenv(TAG))' \
              k8s/kustomization.yaml
          done
          git diff
      - name: Commit et push
        run: |
          git config user.name "LOIC"
          git config user.email "110932552+loic-ngue@users.noreply.github.com"
          git commit -am "Déploie ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
