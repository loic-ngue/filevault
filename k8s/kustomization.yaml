# Point d'entrée des manifestes : kubectl apply -k k8s/  (et ArgoCD, qui lit ce dossier).
# Le pipeline CD réécrit la section images à chaque commit (étape 7) :
#   newName -> ghcr.io/<compte>/filevault-<service>, newTag -> identifiant du commit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: filevault
labels:
  - pairs: {app.kubernetes.io/part-of: filevault}
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - redis.yaml
  - minio.yaml
  - link-service.yaml
  - upload-service.yaml
  - download-service.yaml
  - frontend.yaml
  - cleanup.yaml
  - ingress.yaml
  - autoscaling.yaml
  - network-policies.yaml
# Réécrit par le pipeline à chaque push sur main (étape 7). Valeurs de départ : images
# locales construites par scripts/deployer-local.ps1.
images:
  - name: filevault/link-service
    newTag: 448685812912a939fa1977e2f8da0fc1a8d17c14
    newName: ghcr.io/loic-ngue/filevault-link-service
  - name: filevault/upload-service
    newTag: 448685812912a939fa1977e2f8da0fc1a8d17c14
    newName: ghcr.io/loic-ngue/filevault-upload-service
  - name: filevault/download-service
    newTag: 448685812912a939fa1977e2f8da0fc1a8d17c14
    newName: ghcr.io/loic-ngue/filevault-download-service
  - name: filevault/cleanup
    newTag: 448685812912a939fa1977e2f8da0fc1a8d17c14
    newName: ghcr.io/loic-ngue/filevault-cleanup
  - name: filevault/frontend
    newTag: 448685812912a939fa1977e2f8da0fc1a8d17c14
    newName: ghcr.io/loic-ngue/filevault-frontend
