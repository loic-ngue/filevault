apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # utilisateur nginx de l'image nginx-unprivileged
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: filevault/frontend
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # Nginx écrit son pid et son cache dans /tmp (image nginx-unprivileged).
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /usr/share/nginx/html/config.json, subPath: config.json }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap: { name: frontend-config }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - port: 8080
