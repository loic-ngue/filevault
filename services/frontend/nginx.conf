server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # ES-11 : aucune ressource externe, aucun script en ligne.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Remplaçable par une ConfigMap (durées autorisées, limites).
    location = /config.json {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
